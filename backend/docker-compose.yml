services:
  postgres:
    image: postgis/postgis:17-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vizin
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vizin"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - vizin_postgres:/var/lib/postgresql/data

volumes:
  vizin_postgres:
