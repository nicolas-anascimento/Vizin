<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<link rel="stylesheet" href="../Login/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
 
<title>Redefinir Senha</title>
 
</head>
<body>
 
        <div class="container">
        <div class="curved-shape"></div>
        <div class="curved-shape2"></div>
        <div class="form-box Login">
            <center><img src="../img/logo.png" alt="logo" class="animation" style="--D:0; --S:21"></center>
 
            <!-- Mostrado só quando não há token válido na URL -->
            <div id="resetInvalido" class="link-invalido" style="display:none;">
                <p>❌ Este link é inválido ou já expirou.</p>
                <a href="/recuperar-senha" class="voltar">Solicitar novo link</a>
                <a href="/login" class="voltar">← Voltar ao login</a>
            </div>
 
            <form id="formResetar">
 
                <div class="input-box">
                    <input
                        type="password"
                        id="novaSenha"
                        required
                    >
                    <label for="novaSenha">Nova senha</label>
                    <i class="bi bi-eye-slash toggle-senha" id="novaSenhaToggle"></i>
                </div>
                <p class="dica-senha">Mínimo 8 caracteres, com pelo menos 1 letra e 1 número.</p>
 
                <div class="input-box">
                    <input
                        type="password"
                        id="confirmarSenha"
                        required
                    >
                    <label for="confirmarSenha">Confirmar senha</label>
                    <i class="bi bi-eye-slash toggle-senha" id="confirmarSenhaToggle"></i>
                </div>
 
                <button class="btn" type="submit">
                    Alterar Senha
                </button>
 
                <div class="regi-link">
                    <a href="/login" class="voltar">← Voltar ao login</a>
                </div>
 
            </form>
 
            <p id="mensagem"></p>
        </div>
        <div class="info-content Login">
            <h2 class="animation" style="--D:0; --S:20">Redefinir Senha</h2>
        </div>
     </div>
 
<script src="../Login/api.js"></script>
<script src="resetar-senha.js"></script>
 
</body>
</html>
