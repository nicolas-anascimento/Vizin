<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/usuario/Login/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Login</title>
</head>
<body>
 
    <!-- Formulário de login -->
     <div class="container">
        <div class="curved-shape"></div>
        <div class="curved-shape2"></div>
        <div class="form-box Login">
            <center><img src="/assets/usuario/img/logo.png" alt="logo" class="animation" style="--D:0; --S:21"></center>
            <h2 class="animation" style="--D:0; --S:21">Entre na sua conta</h2>
            <form id="loginForm">
                <div class="input-box animation" style="--D:1; --S:22">
                    <input type="text" name="cpf" id="loginCpf" inputmode="numeric" maxlength="14" required
                        autocomplete="off">
                    <label for="loginCpf">CPF</label>
                    <i class="bi bi-person-vcard"></i>
                </div>
                <div class="input-box animation" style="--D:2; --S:23">
                    <input type="password" name="senha" id="loginSenha" required>
                    <label for="loginSenha">Senha</label>
                    <i class="bi bi-eye-slash toggle-senha" id="loginSenhaToggle"></i>
                </div>
                <div class="forgot-password animation" style="--D:2; --S:23">
                    <a href="/recuperar-senha" id="esqueciSenha" class="esqueciSenha">
                        Esqueci minha senha
                    </a>
                </div>
                <div class="input-box animation" style="--D:3; --S:24">
                    <button class="btn" type="submit">Entrar</button>
                </div>
                <p id="loginErro" class="animation" style="--D:3; --S:24"></p>
                <div class="regi-link animation" style="--D:4; --S:25">
                    <p>Não tem uma conta? <a href="/cadastro" class="SignUpLink">Cadastre-se</a></p> 
                </div>
            </form>
        </div>
        <div class="info-content Login">
            <h2 class="animation" style="--D:0; --S:20">bem-vindo de volta</h2>
        </div>
 
 
        <div class="form-box Register">
            <center><img src="/assets/usuario/img/logo.png" alt="logo" class="animation" style="--li:17; --S:0"></center>
            <h2 class="animation" style="--li:17; --S:0">Crie sua conta</h2>
 
            <div class="step-indicator animation" style="--li:17; --S:0">
                <span class="step-dot active" data-dot="1"></span>
                <span class="step-dot" data-dot="2"></span>
                <span class="step-dot" data-dot="3"></span>
            </div>
 
            <form id="cadastroForm" class="animation" style="--li:17; --S:0" novalidate>
                <div class="cadastro-steps-wrapper">
                    <div class="cadastro-track" id="cadastroTrack">
 
                        <!-- ETAPA 1: nome e email -->
                        <div class="cadastro-step" data-step="1">
                            <div class="input-box">
                                <input type="text" name="nome" id="registerNome" required>
                                <label for="registerNome">Nome</label>
                                <i class="bi bi-person-fill"></i>
                            </div>
 
                            <div class="input-box">
                                <input type="text" name="email" id="registerEmail" required>
                                <label for="registerEmail">Email</label>
                                <i class="bi bi-envelope"></i>
                            </div>
 
                            <p id="step1Erro" class="step-erro"></p>
 
                            <div class="input-box">
                                <button class="btn" type="button" id="btnStep1Next">Próximo</button>
                            </div>
 
                            <div class="regi-link">
                                <p>Já tem uma conta? <a href="/login" class="SignInLink">Faça login</a></p>
                            </div>
                        </div>
 
                        <!-- ETAPA 2: senha e confirmar senha -->
                        <div class="cadastro-step" data-step="2">
                            <div class="input-box">
                                <input type="password" name="senha" id="registerSenha" required>
                                <label for="registerSenha">Senha</label>
                                <i class="bi bi-eye-slash toggle-senha" id="registerSenhaToggle"></i>
                            </div>
 
                            <div class="input-box">
                                <input type="password" name="confirmarSenha" id="registerConfirmarSenha" required>
                                <label for="registerConfirmarSenha">Confirmar senha</label>
                                <i class="bi bi-eye-slash toggle-senha" id="registerConfirmarSenhaToggle"></i>
                            </div>
 
                            <p id="step2Erro" class="step-erro"></p>
 
                            <div class="step-buttons">
                                <button class="btn-voltar" type="button" id="btnStep2Back">Voltar</button>
                                <button class="btn" type="button" id="btnStep2Next">Próximo</button>
                            </div>
                        </div>
 
                        <!-- ETAPA 3: CPF e WhatsApp -->
                        <div class="cadastro-step" data-step="3">
                            <div class="input-box">
                                <input type="text" name="cpf" id="registerCpf" inputmode="numeric" maxlength="14" required>
                                <label for="registerCpf">CPF</label>
                                <i class="bi bi-person-vcard"></i>
                            </div>
 
                            <div class="input-box">
                                <input type="text" name="whatsapp" id="registerWhatsapp" inputmode="numeric" maxlength="15" required>
                                <label for="registerWhatsapp">WhatsApp</label>
                                <i class="bi bi-whatsapp"></i>
                            </div>
 
                            <label class="termos-checkbox-linha">
                                <input type="checkbox" id="registerAceitarTermos">
                                <span>Li e aceito os <a href="/termos" target="_blank" rel="noopener">Termos de Uso</a> e a <a href="/politica-de-privacidade" target="_blank" rel="noopener">Política de Privacidade</a>.</span>
                            </label>
 
                            <p id="registerErro" class="step-erro"></p>
 
                            <div class="step-buttons">
                                <button class="btn-voltar" type="button" id="btnStep3Back">Voltar</button>
                                <button class="btn" type="submit">Finalizar cadastro</button>
                            </div>
                        </div>
 
                    </div>
                </div>
            </form>
        </div>
        <div class="info-content Register">
            <h2 class="animation"  style="--li:17; --S:0">bem-vindo</h2>
        </div>
     </div>
 
    <script src="/assets/usuario/Login/api.js"></script>
    <script src="/assets/usuario/Login/login.js"></script>
 
</body>
</html>
