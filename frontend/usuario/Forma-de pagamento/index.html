<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/usuario/Produto/fluxo-aluguel.css">
    <link rel="stylesheet" href="/assets/usuario/header/header.css">
    <link rel="stylesheet" href="/assets/usuario/footer/footer.css">
    <link rel="stylesheet" href="/assets/usuario/Minha-conta/conta-shared.css">
    <link rel="stylesheet" href="/assets/usuario/utils/pagamento-gateway.css">
    <link rel="stylesheet" href="/assets/usuario/Forma-de pagamento/pagamento.css?v=15">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Forma de pagamento</title>
</head>
<body>

    <div id="header"></div>

    <div class="page-container conta-container">

        <a class="conta-voltar" href="/perfil"><i class="bi bi-arrow-left"></i> Voltar ao perfil</a>

        <h1 class="conta-titulo-pagina">Forma de pagamento</h1>
        <p class="conta-subtitulo-pagina">Usada para pagar os aluguéis que você faz na plataforma.</p>

        <div class="conta-info">
            <i class="bi bi-shield-lock"></i>
            <span>Seus dados de cartão são processados por um parceiro de pagamentos e não ficam armazenados nos nossos servidores.</span>
        </div>

        <div class="card">
            <div class="card-flex">
                <div>
                    <h2>Cartões salvos</h2>
                </div>
                <div>
                    <button type="button" class="btn-mostrar-mais" id="btn-adicionar-cartao" style="margin-top:14px;">+ Adicionar cartão</button>
                </div>
            </div>
            <div id="lista-cartoes"></div>
            <p id="cartoes-status" style="font-size:13.5px; color:var(--texto-suave,#555); display:none;" role="status"></p>
            <button type="button" class="cartao-acao-link" id="btn-recarregar-cartoes" style="display:none;">Tentar novamente</button>
        </div>

    </div>

    <!-- Modal: adicionar cartão -->
    <div class="modal-overlay" id="modal-adicionar-cartao">
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="titulo-adicionar-cartao">
            <h2 id="titulo-adicionar-cartao">Adicionar cartão</h2>
            <form id="formAdicionarCartao" novalidate>
                <!-- Número, validade e CVV: o Mercado Pago injeta um iframe seguro
                     em cada <div class="campo-seguro">. Não são <input> nossos. -->
                <div class="conta-field">
                    <label>Número do cartão</label>
                    <div id="cartaoNumero" class="campo-seguro"></div>
                </div>
                <div class="conta-field">
                    <label for="cartaoNome">Nome impresso no cartão</label>
                    <input type="text" id="cartaoNome" autocomplete="cc-name" required>
                </div>
                <div class="conta-field">
                    <label for="cartaoCpf">CPF do titular</label>
                    <input type="text" id="cartaoCpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off" required>
                </div>
                <div style="display:flex; gap:12px;">
                    <div class="conta-field" style="flex:1;">
                        <label>Validade (MM/AA)</label>
                        <div id="cartaoValidade" class="campo-seguro"></div>
                    </div>
                    <div class="conta-field" style="flex:1;">
                        <label>CVV</label>
                        <div id="cartaoCvv" class="campo-seguro"></div>
                    </div>
                </div>

                <p id="mensagemCartao" class="conta-mensagem" role="alert"></p>

                <div class="modal-confirm-actions">
                    <button type="button" class="btn btn-secondary" id="btn-cancelar-cartao">Cancelar</button>
                    <button type="submit" class="btn btn-perfil-salvar" id="btn-salvar-cartao">Salvar cartão</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: confirmar remoção -->
    <div class="modal-overlay" id="modal-remover-cartao">
        <div class="modal-box modal-confirm" role="dialog" aria-modal="true" aria-labelledby="titulo-remover-cartao">
            <i class="bi bi-exclamation-triangle"></i>
            <h2 id="titulo-remover-cartao">Remover cartão?</h2>
            <p id="texto-remover-cartao"></p>
            <p id="erro-remover-cartao" class="conta-mensagem erro" role="alert"></p>
            <div class="modal-confirm-actions">
                <button type="button" class="btn btn-secondary" id="modal-remover-voltar">Cancelar</button>
                <button type="button" class="btn btn-danger" id="modal-remover-confirmar">Remover</button>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <!-- SDK do Mercado Pago ANTES dos nossos scripts de pagamento -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <script src="/assets/usuario/header/frame.js"></script>
    <script src="/assets/usuario/utils/config.js"></script>
    <script src="/assets/usuario/utils/api-client.js"></script>
    <script src="/assets/usuario/Notificacoes/solicitacoes-shared.js"></script>
    <script src="/assets/usuario/utils/pagamentos-api.js"></script>
    <script src="/assets/usuario/utils/pagamento-gateway.js"></script>
    <script src="/assets/usuario/Forma-de pagamento/pagamento.js"></script>
</body>
</html>
