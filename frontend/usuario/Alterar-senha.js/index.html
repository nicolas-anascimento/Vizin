<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/usuario/Produto/fluxo-aluguel.css">
    <link rel="stylesheet" href="/assets/usuario/header/header.css">
    <link rel="stylesheet" href="/assets/usuario/footer/footer.css">
    <link rel="stylesheet" href="/assets/usuario/Minha-conta/conta-shared.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Alterar senha</title>
</head>
<body>
 
    <div id="header"></div>
 
    <div class="page-container conta-container">
 
        <a class="conta-voltar" href="/minha-conta"><i class="bi bi-arrow-left"></i> Voltar para Minha conta</a>
 
        <h1 class="conta-titulo-pagina">Alterar senha</h1>
        <p class="conta-subtitulo-pagina">Depois de salvar, você continuará conectado neste dispositivo, mas recomendamos sair dos demais.</p>
 
        <div class="card">
            <form id="formAlterarSenha">
                <div class="conta-field conta-field-senha">
                    <label for="senhaAtual">Senha atual</label>
                    <input type="password" id="senhaAtual" required autocomplete="current-password">
                    <i class="bi bi-eye-slash toggle-senha" id="toggleSenhaAtual"></i>
                </div>
 
                <div class="conta-field conta-field-senha">
                    <label for="senhaNova">Nova senha</label>
                    <input type="password" id="senhaNova" required autocomplete="new-password">
                    <i class="bi bi-eye-slash toggle-senha" id="toggleSenhaNova"></i>
                </div>
 
                <div class="conta-field conta-field-senha">
                    <label for="senhaConfirmar">Confirmar nova senha</label>
                    <input type="password" id="senhaConfirmar" required autocomplete="new-password">
                    <i class="bi bi-eye-slash toggle-senha" id="toggleSenhaConfirmar"></i>
                </div>
 
                <p id="mensagemSenha" class="conta-mensagem"></p>
 
                <button type="submit" class="btn" id="btnSalvarSenha">Salvar nova senha</button>
            </form>
        </div>
 
    </div>
 
    <div id="footer"></div>
 
    <script src="/assets/usuario/header/frame.js"></script>
    <script src="/assets/usuario/Login/api.js"></script>
    <script src="/assets/usuario/Alterar-senha.js/alterar-senha.js"></script>
</body>
</html>
