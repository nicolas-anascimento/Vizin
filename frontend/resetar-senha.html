<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<title>Redefinir Senha</title>

</head>
<body>

        <div class="container">
        <div class="curved-shape"></div>
        <div class="curved-shape2"></div>
        <div class="form-box Login">
            <center><img src="/assets/img/logo.png" alt="logo" class="animation" style="--D:0; --S:21"></center>
            
            <form id="formResetar">

                <div class="input-box">
                    <input
                        type="password"
                        id="novaSenha"
                        required
                    >
                    <label>Nova senha</label>
                    <i class="bi bi-lock-fill"></i>
                </div>

                <div class="input-box">
                    <input
                        type="password"
                        id="confirmarSenha"
                        required
                    >
                    <label>Confirmar senha</label>
                    <i class="bi bi-lock-fill"></i>
                </div>

                <button class="btn" type="submit">
                    Alterar Senha
                </button>

            </form>

            <p id="mensagem"></p>
        </div>
        <div class="info-content Login">
            <h2 class="animation" style="--D:0; --S:20">Redefinir Senha</h2>
        </div>
     </div>

<script src="/assets/js/resetar-senha.js"></script>

</body>
</html>
