<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Produto/fluxo-aluguel.css">
    <link rel="stylesheet" href="notificacoes-shared.css">
    <link rel="stylesheet" href="notificacoes.css">
    <link rel="stylesheet" href="../header/header.css">
    <link rel="stylesheet" href="../footer/footer.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Notificações</title>
</head>
<body>

    <div id="header"></div>

    <div class="page-container notificacoes-container">

        <!-- CABEÇALHO -->
        <div class="notificacoes-header">
            <div>
                <h1 class="notificacoes-titulo">Notificações</h1>
                <p class="notificacoes-subtitulo" id="notificacoes-subtitulo"></p>
            </div>
            <i class="bi bi-bell notificacoes-icone-grande"></i>
        </div>

        <!-- NÃO LIDAS -->
        <div id="secao-nao-lidas">
            <h2 class="secao-titulo">Não lidas</h2>
            <div id="lista-nao-lidas"></div>
        </div>

        <!-- LIDAS -->
        <div id="secao-lidas">
            <h2 class="secao-titulo">Lidas</h2>
            <div id="lista-lidas"></div>
        </div>

        <!-- ESTADO VAZIO -->
        <div class="notificacoes-vazio" id="notificacoes-vazio" style="display:none;">
            <i class="bi bi-bell-slash"></i>
            <p>Você não tem nenhuma notificação.</p>
        </div>

    </div>

    <div id="footer"></div>

    <div id="toast" class="toast">Copiado ✔</div>

    <script src="../header/frame.js"></script>

    <script src="../Login/logout.js"></script>

    <script src="notificacoes-shared.js"></script>

    <script src="notificacoes.js"></script>
</body>
</html>
