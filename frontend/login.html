<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Login</title>
</head>
<body>

    <!-- Formulário de login -->
     <div class="container">
        <div class="curved-shape"></div>
        <div class="curved-shape2"></div>
        <div class="form-box Login">
            <center><img src="/assets/img/logo.png" alt="logo" class="animation" style="--D:0; --S:21"></center>
            <h2 class="animation" style="--D:0; --S:21">Entre na sua conta</h2>
            <form action="#">
                <div class="input-box animation" style="--D:1; --S:22">
                    <input type="text" name="email" id="loginEmail" required>
                    <label for="loginEmail">Email</label>
                    <i class="bi bi-envelope"></i>
                </div>
                <div class="input-box animation" style="--D:2; --S:23">
                    <input type="password" name="senha" id="loginSenha" required>
                    <label for="loginSenha">Senha</label>
                    <i class="bi bi-lock-fill"></i>
                </div>
                <div class="forgot-password animation" style="--D:2; --S:23">
                    <a href="#" id="esqueciSenha" class="esqueciSenha">
                        Esqueci minha senha
                    </a>
                </div>
                <div class="input-box animation" style="--D:3; --S:24">
                    <button class="btn" type="submit">Entrar</button>
                </div>
                <p id="loginErro" class="animation" style="--D:3; --S:24"></p>
                <div class="regi-link animation" style="--D:4; --S:25">
                    <p>Não tem uma conta? <a href="#" class="SignUpLink">Cadastre-se</a></p> 
                </div>
            </form>
        </div>
        <div class="info-content Login">
            <h2 class="animation" style="--D:0; --S:20">bem-vindo de volta</h2>
        </div>


        <div class="form-box Register">
            <center><img src="/assets/img/logo.png" alt="logo" class="animation" style="--li:17; --S:0"></center>
            <h2 class="animation" style="--li:17; --S:0">Crie sua conta</h2>
            <form action="#">

                <div class="input-box animation" style="--li:18; --S:1">
                    <input type="text" name="nome" id="registerNome" required>
                    <label for="registerNome">Nome</label>
                    <i class="bi bi-person-fill"></i>
                </div>

                <div class="input-box animation"  style="--li:19; --S:2">
                    <input type="text" name="email" id="registerEmail" required>
                    <label for="registerEmail">Email</label>
                    <i class="bi bi-envelope"></i>
                </div>

                <div class="input-box animation"  style="--li:20; --S:3">
                    <input type="password" name="senha" id="registerSenha" required>
                    <label for="registerSenha">Senha</label>
                    <i class="bi bi-lock-fill"></i>
                </div>

                <div class="input-box animation"  style="--li:21; --S:4">
                    <button class="btn" type="submit">Criar conta</button>
                </div>

                <p id="registerErro"  class="animation" style="--li:21; --S:4" ></p>
                <div class="regi-link animation"  style="--li:21; --S:4">
                    <p>Já tem uma conta? <a href="#" class="SignInLink">Faça login</a></p> 
                </div>

            </form>
        </div>
        <div class="info-content Register">
            <h2 class="animation"  style="--li:17; --S:0">bem-vindo</h2>
        </div>
     </div>

    <script src="/assets/js/api.js"></script>

    <script src="/assets/js/login.js"></script>
</body>
</html>
