<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../Login/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<title>Recuperar Senha</title>
</head>
<body>

    <div class="container">
        <div class="curved-shape"></div>
        <div class="curved-shape2"></div>
        <div class="form-box Login">
            <center><img src="../img/logo.png" alt="logo" class="animation" style="--D:0; --S:21"></center>
            
            <p>
                Informe seu email para receber o link de redefinição.
            </p>
            <form id="formRecuperar" class="recuperar">

                <div class="input-box">
                    <input
                        type="email"
                        id="email"
                        required
                    >
                    <label>Email</label>
                    <i class="bi bi-envelope"></i>
                </div>

                <button class="btn" type="submit">
                    Enviar Link
                </button>

            </form>

            <p id="mensagem"></p>

                <a href="/login" class="voltar">
                    ← Voltar ao login
                </a>
        </div>
        <div class="info-content Login">
            <h2 class="animation" style="--D:0; --S:20">Recuperar Senha</h2>
        </div>
     </div>

<script src="recuperar-senha.js"></script>

</body>
</html>
