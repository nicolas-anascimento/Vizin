<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css?v=9">
    <link rel="stylesheet" href="../header/header.css?v=9">
    <link rel="stylesheet" href="../footer/footer.css">
    <link rel="stylesheet" href="../Notificacoes/notificacoes-shared.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Início</title>
</head>
<body>
 
<div id="header"></div>
 
<section>
    <div class="container">
        <div class="banner">
            <div>
                <p id="boasVindas" class="boas-vindas"></p>
                <h1>Descubra objetos próximos</h1>
                <p>Encontre o que você precisa na sua vizinhança.</p>
            </div>
            <div class="banner-cta">
                <a href="../Cadastrar-objeto/index.html">
                    <button class="btn-adicionar">
                        <i class="bi bi-plus-lg"></i> Anunciar objeto
                    </button>
                </a>
            </div>
        </div>
 
        <div class="banner-pesquisa">
 
            <div class="buscar-box">
                <div class="lupa-buscar">
                    <i class="bi bi-search"></i>
                </div>
                <div class="input-buscar">
                    <input type="text" name="busca" id="inputBusca" placeholder="Buscar objetos...">
                </div>
            </div>
 
            <div class="buscar-box">
                <div class="lupa-buscar">
                    <i class="bi bi-geo-alt"></i>
                </div>
                <div class="input-buscar">
                    <input type="text" name="localizacao" id="inputLocal" placeholder="Localização...">
                </div>
            </div>
 
            <div class="buscar-box2">
                <select name="categorias" id="selectCategoria">
                    <option value="">Todas</option>
                    <option value="ferramentas">Ferramentas</option>
                    <option value="eletronicos">Eletrônicos</option>
                    <option value="camping">Camping</option>
                    <option value="esportes">Esportes</option>
                    <option value="festas">Festas</option>
                    <option value="casajardim">Casa e jardim</option>
                    <option value="transportes">Transportes</option>
                    <option value="outros">Outros</option>
                </select>
            </div>
 
        </div>
 
        <!-- Contador de resultados: preenchido via JS, escondido quando a base
             de objetos ainda não tem nenhum item cadastrado -->
        <p id="contadorResultados" class="contador-resultados" aria-live="polite">
            <i class="bi bi-grid"></i>
            <span></span>
        </p>
 
        <!-- RESULTADOS -->
        <div id="lista-objetos"></div>
    </div>
 
</section>
 
<div id="footer"></div>
 
<div id="toast" class="toast">Copiado ✔</div>
 
<script src="../utils/formatacao.js"></script>
<script src="../header/frame.js"></script>
<script src="../Login/logout.js"></script>
<script src="../Notificacoes/notificacoes-shared.js"></script>
<script src="../Meus-objetos/objetos-shared.js"></script>
<script src="../Notificacoes/solicitacoes-shared.js"></script>
<script src="../Avaliacao/avaliacoes-shared.js"></script>
<script src="script.js"></script>
</body>
</html>
