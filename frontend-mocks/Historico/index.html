<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Meus-objetos/meus-objetos.css">
    <link rel="stylesheet" href="historico.css?v=21">
    <link rel="stylesheet" href="../header/header.css">
    <link rel="stylesheet" href="../footer/footer.css">
    <link rel="stylesheet" href="../Notificacoes/notificacoes-shared.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Histórico de Aluguéis</title>
</head>
<body>
 
    <div id="header"></div>
 
    <div class="page-container">
 
        <div class="page-header">
            <div>
                <h1 class="page-title">Histórico de Aluguéis</h1>
                <p class="page-subtitle">Acompanhe todos os seus aluguéis</p>
            </div>
        </div>
 
        <!-- TODO: remover este bloco quando integrar com o back-end real. -->
        <div class="sim-papel-toggle" id="sim-papel-toggle-historico">
            <span>🧪 [Simulação] Ver como:</span>
            <button type="button" class="sim-papel-btn" data-papel="locatario">Locatário</button>
            <button type="button" class="sim-papel-btn" data-papel="proprietario">Proprietário</button>
        </div>
 
        <!-- Filtro por papel do usuário no aluguel -->
        <div class="historico-tabs">
            <button type="button" class="historico-tab active" data-filtro="todos">Todos</button>
            <button type="button" class="historico-tab" data-filtro="alugados">Alugados</button>
            <button type="button" class="historico-tab" data-filtro="alugados-para-outros">Alugados para outros</button>
            <button type="button" class="historico-tab" data-filtro="solicitacoes">Solicitações<span class="historico-tab-badge" id="badge-solicitacoes"></span></button>
        </div>
 
        <!-- Estado vazio (sem aluguéis no filtro atual) -->
        <div class="empty-state" id="empty-state" style="display:none;">
            <i class="bi bi-clock-history"></i>
            <p>Nenhum aluguel encontrado por aqui.</p>
        </div>
 
        <!-- Lista de aluguéis -->
        <div id="lista-historico"></div>
 
    </div>
 
    <!-- Modal de Confirmação de Cancelamento -->
    <div class="modal-overlay" id="modal-cancelar">
        <div class="modal-box modal-confirm">
            <i class="bi bi-exclamation-triangle"></i>
            <h2>Cancelar locação?</h2>
            <p id="modal-cancelar-texto">Tem certeza que deseja cancelar esta locação? O valor pago (se houver) será estornado e o objeto voltará a ficar disponível.</p>
            <div class="modal-confirm-actions">
                <button type="button" class="modal-btn-voltar" id="modal-cancelar-voltar">Voltar</button>
                <button type="button" class="modal-btn-confirmar-cancelamento" id="modal-cancelar-confirmar">Cancelar Locação</button>
            </div>
        </div>
    </div>
 
    <div id="footer"></div>
 
    <div id="toast" class="toast">Copiado ✔</div>
 
    <script src="../header/frame.js"></script>
 
    <script src="../Login/logout.js"></script>
 
    <script src="../Notificacoes/notificacoes-shared.js"></script>
 
    <script src="../Notificacoes/solicitacoes-shared.js"></script>
 
    <script src="../utils/formatacao.js"></script>
<script src="../Meus-objetos/objetos-shared.js"></script>
<script src="../Retirada-objeto/retirada-shared.js"></script>
<script src="../Devolucao-objeto/devolucao-shared.js"></script>
<script src="historico.js?v=22"></script>
</body>
</html>
