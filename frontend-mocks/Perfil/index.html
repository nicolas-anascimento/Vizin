<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Produto/fluxo-aluguel.css">
    <link rel="stylesheet" href="perfil.css">
    <link rel="stylesheet" href="../header/header.css">
    <link rel="stylesheet" href="../footer/footer.css">
    <link rel="stylesheet" href="../Notificacoes/notificacoes-shared.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Perfil</title>
</head>
<body>

    <div id="header"></div>

    <div class="page-container perfil-container">

        <!-- CABEÇALHO DO PERFIL -->
        <div class="perfil-header">

            <div class="perfil-avatar-wrap">
                <div class="perfil-avatar" id="perfil-avatar">
                    <img id="perfil-avatar-img" src="" alt="" style="display:none;">
                    <span id="perfil-avatar-inicial"></span>
                </div>
                <button type="button" class="perfil-avatar-camera" id="btn-trocar-foto" title="Trocar foto">
                    <i class="bi bi-camera-fill"></i>
                </button>
                <input type="file" id="input-avatar" accept="image/png, image/jpeg, image/jpeg" hidden>
            </div>

            <div class="perfil-header-info">
                <h1 class="perfil-nome" id="perfil-nome-view"></h1>
                <input type="text" class="perfil-nome-input" id="perfil-nome-input" style="display:none;">

                <p class="perfil-email" id="perfil-email"></p>

                <div class="perfil-meta">
                    <span><i class="bi bi-star-fill"></i> <span id="perfil-avaliacao-media"></span> (<span id="perfil-avaliacao-total"></span> avaliações)</span>
                    <span><i class="bi bi-calendar3"></i> Membro desde <span id="perfil-membro-desde"></span></span>
                    <span class="perfil-verificado" id="perfil-verificado"><i class="bi bi-patch-check-fill"></i> Verificado</span>
                </div>
            </div>

            <div class="perfil-header-actions">
                <button type="button" class="btn btn-perfil-editar" id="btn-editar-perfil">
                    <i class="bi bi-pencil"></i> Editar Perfil
                </button>
                <div class="perfil-edit-actions" id="perfil-edit-actions" style="display:none;">
                    <button type="button" class="btn btn-perfil-cancelar" id="btn-cancelar-edicao">Cancelar</button>
                    <button type="button" class="btn btn-perfil-salvar" id="btn-salvar-edicao">Salvar</button>
                </div>
            </div>

        </div>

        <div class="perfil-grid">

            <!-- COLUNA PRINCIPAL -->
            <div class="perfil-main">

                <div class="card">
                    <h2>Sobre</h2>

                    <!-- Modo edição: campo de nome (visível só ao editar) -->
                    <div class="field" id="campo-nome-edicao" style="display:none;">
                        <label for="input-nome">Nome</label>
                        <input type="text" id="input-nome">
                    </div>

                    <!-- Modo visualização -->
                    <p class="perfil-bio-view" id="perfil-bio-view"></p>

                    <!-- Modo edição: bio -->
                    <div class="field" id="campo-bio-edicao" style="display:none;">
                        <label for="input-bio">Bio</label>
                        <textarea id="input-bio"></textarea>
                    </div>
                </div>

                <div class="card">
                    <h2>Avaliações Recebidas</h2>
                    <div id="lista-avaliacoes"></div>
                </div>

            </div>

            <!-- SIDEBAR -->
            <div class="perfil-sidebar">
                <div class="card">
                    <h2>Estatísticas</h2>
                    <div class="stat-linha">
                        <span>Objetos alugados:</span>
                        <span id="stat-alugados"></span>
                    </div>
                    <div class="stat-linha">
                        <span>Objetos anunciados:</span>
                        <span id="stat-anunciados"></span>
                    </div>
                    <div class="stat-linha">
                        <span>Taxa de resposta:</span>
                        <span id="stat-resposta"></span>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <div id="footer"></div>

        <div id="toast" class="toast">Copiado ✔</div>

    <script src="../header/frame.js"></script>

    <script src="../Login/logout.js"></script>

    <script src="../Notificacoes/notificacoes-shared.js"></script>

    <script src="perfil.js"></script>
</body>
</html>
